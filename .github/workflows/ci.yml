name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # only the light deps needed by the pure-function tests (no torch / rasterio / contextily)
      - name: Install test deps
        run: |
          pip install numpy scipy shapely pyproj geopandas pytest ruff
          pip install -e . --no-build-isolation

      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check roofkit tests

      - name: Unit tests
        run: pytest -q
